<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ativos | Simulador Financeiro</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    
    <style>
        body {
            padding-top: 20px;
            background-color: #f8f9fa;
        }
        
        .navbar {
            margin-bottom: 30px;
            box-shadow: 0 2px 4px rgba(0,0,0,.1);
        }
        
        .card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0,0,0,.075);
            transition: transform 0.2s;
            margin-bottom: 20px;
        }
        
        .card:hover {
            transform: translateY(-2px);
        }
        
        .footer {
            margin-top: 50px;
            padding: 20px 0;
            border-top: 1px solid #e7e7e7;
            background-color: #f8f9fa;
        }
        
        .table-hover tbody tr:hover {
            background-color: rgba(0,123,255,.1);
        }
        
        .badge {
            font-weight: 500;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-graph-up me-2"></i>Simulador Financeiro
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/ativos">Ativos</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/carteira">Minha Carteira</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/transacoes/comprar">Comprar Ações</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="display-5 fw-bold text-primary">Ativos Disponíveis</h1>
                <p class="lead text-muted">Lista completa de ações para investir.</p>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-6">
                <input type="text" class="form-control" placeholder="Buscar ativo por ticker ou nome..." id="searchInput">
            </div>
            <div class="col-md-6">
                <select class="form-control" id="filterSetor">
                    <option value="">Todos os setores</option>
                    <option th:each="setor : ${setores}" th:value="${setor}" th:text="${setor}"></option>
                </select>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <table class="table table-hover" id="ativosTable">
                    <thead>
                        <tr>
                            <th>Ticker</th>
                            <th>Empresa</th>
                            <th>Setor</th>
                            <th>Preço Atual</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="ativo : ${ativos}">
                            <td>
                                <strong class="fs-5" th:text="${ativo.ticker}">PETR4</strong>
                            </td>
                            <td th:text="${ativo.nomeEmpresa}">Petrobras</td>
                            <td>
                                <span class="badge bg-secondary" th:text="${ativo.setor}">Energia</span>
                            </td>
                            <td>
                                <span th:if="${ativo.precoAtual != null}" 
                                      class="fw-bold"
                                      th:text="'R$ ' + ${#numbers.formatDecimal(ativo.precoAtual, 1, 2, 'POINT')}">
                                    R$ 35,50
                                </span>
                                <span th:if="${ativo.precoAtual == null}" class="text-muted">N/A</span>
                            </td>
                            <td>
                                <a th:href="@{'/transacoes/comprar?ativoId=' + ${ativo.id}}" 
                                   class="btn btn-sm btn-success">
                                    <i class="bi bi-cart-plus"></i> Comprar
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container text-center">
            <span class="text-muted">Simulador Financeiro - Desenvolvido para aprendizado</span>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Filtro de busca
        document.getElementById('searchInput').addEventListener('keyup', function() {
            const filter = this.value.toLowerCase();
            const rows = document.querySelectorAll('#ativosTable tbody tr');
            
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(filter) ? '' : 'none';
            });
        });
        
        // Filtro por setor
        document.getElementById('filterSetor').addEventListener('change', function() {
            const filter = this.value;
            const rows = document.querySelectorAll('#ativosTable tbody tr');
            
            rows.forEach(row => {
                const setor = row.querySelector('td:nth-child(3)').textContent.trim();
                row.style.display = (filter === '' || setor === filter) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
